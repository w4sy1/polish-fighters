name: Polish Fighters builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        working-directory: engine
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install conan==2.32.0 Pillow==12.3.0 lupa==2.8 cryptography==50.0.1 jsonschema==4.25.1
      - name: Validate developer tools
        run: python -m unittest discover -s ../tests -v
      - name: Build Windows x64
        run: ./dist/build-windows.ps1 x64
      - uses: actions/upload-artifact@v4
        with:
          name: PolishFighters-Windows-x64
          path: engine/out/PolishFighters-Windows-x64.exe*
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a is the release APK; x86_64 runs on the Android emulator for testing.
        abi: [arm64-v8a, x86_64]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Install native build dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/conan-venv"
          "$RUNNER_TEMP/conan-venv/bin/pip" install conan==2.32.0 Pillow==12.3.0
          echo "$RUNNER_TEMP/conan-venv/bin" >> "$GITHUB_PATH"
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            "$RUNNER_TEMP/conan-venv/bin/pip" install cmake==3.28.3 ninja
          fi
          pkg-config --version
      - name: Build Android ${{ matrix.abi }}
        env:
          # The JVM tests do not depend on the packaged native ABI.
          OPENLF2_ANDROID_RUN_UNIT_TESTS: ${{ matrix.abi == 'x86_64' && 'true' || 'false' }}
        run: bash dist/build-android.sh ${{ matrix.abi }}
      - name: Check bundled Polish Fighters scripts and application ID
        run: python3 ../tools/check_apk.py out/PolishFighters-Android-${{ matrix.abi }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.abi == 'arm64-v8a' && 'PolishFighters-Android-arm64' || format('PolishFighters-Android-{0}', matrix.abi) }}
          path: engine/out/PolishFighters-Android-${{ matrix.abi }}.apk*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'arm64-v8a'
        with:
          name: AndroidStudio-ARM64-native
          path: |
            engine/build/android/jniLibs/
            engine/build/android/sdl-java/
            engine/build/android/assets/
            engine/build/android/res/
          if-no-files-found: error
